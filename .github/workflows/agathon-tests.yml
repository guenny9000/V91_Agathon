name: Agathon package tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/agathon-tests.yml'
  push:
    branches: [v91/fix-agathon-package-2026-10-11]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/agathon-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test runner
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
