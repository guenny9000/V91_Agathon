[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "V91-Agathon"
version = "0.1.0"
description = "V91 Agathon audit and governance components"
authors = [{ name = "V91 Agathon contributors" }]
readme = "README.md"
license = { text = "MIT" }
keywords = ["V91", "Agathon", "Python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["v91"]
