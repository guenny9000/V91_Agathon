[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v91-agathon"
version = "0.2.0"
description = "Reality-first audit primitives and explicitly bounded V91 learning components"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["V91", "audit", "hash-chain", "Ed25519"]
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["v91*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
